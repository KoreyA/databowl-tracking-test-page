<!DOCTYPE html>
<html>
<head>
  <title>Landing Page</title>
  <script src="https://cdn.databowlpages.com/js/dbevt-tracking.1.0.25.js"></script>
</head>
<body>
  <h1>Welcome!</h1>

  <script>
    // Your Databowl credentials
    var urlId = "9b01a6a7-d2c9-4c17-9f11-c147f3d1661e";
    var affiliateId = "efe89f9b-e7bc-4f40-92d1-0fbb47062f03";

    // Initialize tracking
    var trackingOptions = new DbEvtTracking.OptionsObject(
      urlId,
      affiliateId
    );
    var trackingClient = new DbEvtTracking.TrackingClient(
      trackingOptions
    );

    // Extract URL parameters
    var urlParams = new URLSearchParams(window.location.search);

    // Track page view with all URL params
    trackingClient.registerPageView({
      utm_source: urlParams.get('utm_source'),
      utm_medium: urlParams.get('utm_medium'),
      utm_campaign: urlParams.get('utm_campaign'),
      utm_content: urlParams.get('utm_content'),
      utm_term: urlParams.get('utm_term'),
      click_id: urlParams.get('clickid'),
      gclid: urlParams.get('gclid'), // Google Ads
      fbclid: urlParams.get('fbclid'), // Facebook
      msclkid: urlParams.get('msclkid') // Microsoft Ads
    });
  </script>
</body>
</html>
